# Namuna: davlat-mulki monitoringi `davijara.uz/obyektlar` sub-path ostida.
#
# Ilova Next.js `basePath: "/obyektlar"` bilan quriladi (production build avtomatik —
# `src/lib/basePath.ts`), ya'ni HAMMA narsa (`_next/`, `/api/`, sahifalar) `/obyektlar/…`
# manzilida. nginx faqat shu prefiksni ichki 3000-portga uzatadi, prefiksni KESMAYDI.
#
#   sudo nano /etc/nginx/sites-available/davijara.uz     # mavjud faylga qo'shiladi
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ `proxy_pass` da yo'l YO'Q (`http://127.0.0.1:3000;` — oxirida `/` yoki path yo'q).
#    Shunda nginx to'liq URI'ni (`/obyektlar/...`) o'zgartirmasdan uzatadi — bu SHART,
#    aks holda Next.js basePath'ni topa olmaydi.

server {
    listen 443 ssl;
    server_name davijara.uz;

    # ssl_certificate ... (mavjud davijara.uz sertifikati)

    # ── Boshqa loyiha (davijara) — ildizda ──
    location / {
        proxy_pass http://192.168.1.248;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ── Davlat mulki monitoringi — /obyektlar ostida ──
    #    `^~` — regex location'lar qo'shilsa ham shu blok ustuvor qoladi.
    location ^~ /obyektlar {
        proxy_pass http://127.0.0.1:3000;   # ⚠️ path YO'Q — prefiks saqlanadi
        proxy_http_version 1.1;

        # ⚠️ Auth.js (trustHost) va middleware'dagi login redirect shu sarlavhalarga
        #    tayanadi — busiz redirect ichki `127.0.0.1:3000` manziliga ketadi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ⚠️ 15MB PDF + rasm yuklash uchun (next.config.mjs bodySizeLimit = 18mb).
        client_max_body_size 20m;

        # Sync/eksport uzoq davom etishi mumkin (to'liq sync ~7 daqiqa).
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_redirect off;
    }
}
