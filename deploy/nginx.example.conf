# Namuna: /etc/nginx/sites-available/davlat-mulki
# Faollashtirish:
#   sudo ln -s /etc/nginx/sites-available/davlat-mulki /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS uchun:  sudo certbot --nginx -d monitoring.example.uz

server {
    listen 80;
    server_name monitoring.example.uz;

    # certbot qo'shgach bu blok HTTPS'ga yo'naltirishga almashadi
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ⚠️ Auth.js (trustHost: true) shu sarlavhalarga tayanadi — busiz
        #    login redirect'lari noto'g'ri manzilga ketadi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ⚠️ 15MB PDF + rasm yuklash uchun. Kichik bo'lsa nginx 413 qaytaradi
        #    va foydalanuvchi "fayl yuklanmadi" degan tushunarsiz xato ko'radi.
        #    next.config.mjs dagi bodySizeLimit (18mb) bilan mos.
        client_max_body_size 20m;

        # Sync/eksport uzoq davom etishi mumkin (to'liq sync ~7 daqiqa).
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
